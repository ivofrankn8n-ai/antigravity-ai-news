<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Neural Feed</title>
  <script src="env.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f;
      --card-bg: #12121a;
      --border: #1e1e2e;
      --text: #e4e4e7;
      --text-dim: #71717a;
      --accent: #f43f5e;
      --accent2: #8b5cf6;
      --accent3: #06b6d4;
      --accent4: #10b981;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(244, 63, 94, 0.1) 0%, transparent 50%);
    }
    .header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .sync {
      font-size: 0.875rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      min-height: calc(100vh - 80px);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }
    .stat-card:nth-child(1)::before { background: var(--accent); }
    .stat-card:nth-child(2)::before { background: var(--accent2); }
    .stat-card:nth-child(3)::before { background: var(--accent3); }
    .stat-card:nth-child(4)::before { background: var(--accent4); }
    .stat-card h3 { color: var(--text-dim); font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.5rem; }
    
    .articles { display: grid; gap: 1.5rem; }
    .article {
  position: relative;
}
.article-image {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 0.75rem;
}
    .article {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all 0.2s;
      position: relative;
    }
    .article:hover {
      border-color: var(--accent2);
    }
    .article-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .source-badge {
      padding: 0.375rem 0.75rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .source-badge.bensbites { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }
    .source-badge.rundown { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
    .source-badge.reddit { background: rgba(6, 182, 212, 0.15); color: #06b6d4; }
    .source-badge.hackernews { background: rgba(255, 140, 0, 0.15); color: #ff8c00; }
    .article-date {
      color: var(--text-dim);
      font-size: 0.75rem;
      margin-left: auto;
    }
    
    .article-content {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .article-content h3 {
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.5;
      margin: 0;
    }
    .article-content h3 a {
      color: var(--text);
      text-decoration: none;
    }
    .article-content h3 a:hover {
      color: var(--accent2);
    }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .article-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .filters {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--text-dim); }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 1px solid var(--accent2);
      color: white;
    }
    
    .topic-filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .topic-filter-label {
      color: var(--text-dim);
      font-size: 0.75rem;
      font-weight: 500;
    }
    .topic-btn {
      padding: 0.25rem 0.625rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      transition: all 0.15s;
    }
    .topic-btn:hover { border-color: var(--text-dim); }
    .topic-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 1px solid var(--accent2);
      color: white;
    }
    
    .article-tag {
      padding: 0.25rem 0.625rem;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 500;
      cursor: default;
      transition: all 0.15s;
      border: 1px solid transparent;
      background: rgba(139, 92, 246, 0.15);
      color: #8b5cf6;
    }
    .article-tag:hover { transform: scale(1.05); }
    
    .article-footer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }
    .expand-btn {
      color: var(--accent2);
      cursor: pointer;
      font-size: 0.75rem;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .expand-btn:hover { text-decoration: underline; }
    .full-content {
      display: none;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .full-content.expanded { display: block; }
    .save-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 1rem;
    }
    .save-icon:hover { border-color: var(--accent); color: var(--accent); }
    .save-icon.saved { background: var(--accent); border-color: var(--accent); color: white; }
    
    .loading { text-align: center; padding: 3rem; color: var(--text-dim); }
    
    @media (max-width: 768px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .tag-filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 0.5rem; }
    }
    
    .chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
      z-index: 1000;
      transition: transform 0.2s;
    }
    .chat-toggle:hover { transform: scale(1.05); }
    
    .chat-container {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 420px;
      height: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .chat-container.open { display: flex; }
    
    .chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 16px 16px 0 0;
      color: white;
    }
    .chat-close {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .chat-message {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 90%;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .chat-message.bot {
      background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
      align-self: flex-start;
      color: var(--text);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-bottom-left-radius: 4px;
    }
    .chat-message.bot a {
      color: #8b5cf6;
      text-decoration: underline;
    }
    .chat-message.bot a:hover {
      color: #a78bfa;
    }
    .chat-message.user {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      align-self: flex-end;
      color: white;
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-bottom-right-radius: 4px;
    }
    
    .chat-input {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .chat-input input:focus {
      outline: none;
      border-color: var(--accent2);
    }
    .chat-input button {
      background: var(--accent2);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 500;
    }
    .chat-input button:hover { opacity: 0.9; }
    
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 1rem;
    }
    .page-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--text); }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 1px solid var(--accent2);
      color: white;
    }
    .page-info {
      color: var(--text-dim);
      font-size: 0.875rem;
      padding: 0.5rem;
    }
  </style>
  <script>
    let allArticles = [];
    let currentFilter = 'all';
    let currentTag = null;
    let savedArticles = JSON.parse(localStorage.getItem('savedArticles') || '[]');
    let currentPage = 1;
    const ARTICLES_PER_PAGE = 25;
    
    const TOPIC_CATEGORIES = {
      'agentic-ai': {
        label: 'Agentic AI',
        keywords: ['agent', 'agents', 'agentic', 'autonomous', 'automation', 'swarm', 'cli', 'codex']
      },
      'market-updates': {
        label: 'Market updates',
        keywords: ['funding', 'valuation', 'raise', 'investor', 'acquisition', 'billion', 'startup', 'vc', 'investment', 'deal', 'partnership', 'ceo', 'company', 'industry', 'pentagon', 'hired', 'job']
      },
      'demanded-skills': {
        label: 'Demanded AI skills',
        keywords: ['skill', 'learn', 'tutorial', 'course', 'how to', 'guide', 'training', 'prompt', 'prompting', 'engineering', 'build', 'develop', 'coding', 'programming', 'framework', 'api', 'sdk', 'library', 'made coding']
      },
      'new-model-releases': {
        label: 'New model releases',
        keywords: ['gpt', 'claude', 'gemini', 'llama', 'mistral', 'qwen', 'deepseek', 'model release', 'new model', 'launch', 'announce', 'o1', 'o3', 'sonnet', 'haiku', 'opus', 'flash', 'preview', 'version', 'update', 'released', 'shipped']
      }
    };
    
    function classifyArticle(article) {
      if (!article || !article.title) return [];
      const text = ((article.title || '') + ' ' + (article.subtitle || '')).toLowerCase();
      const matchedCategories = [];
      
      for (const [key, category] of Object.entries(TOPIC_CATEGORIES)) {
        for (const keyword of category.keywords) {
          if (text.includes(keyword.toLowerCase())) {
            matchedCategories.push(key);
            break;
          }
        }
      }
      
      return matchedCategories;
    }
    
    function getSourceClass(source) {
      if (source && source.includes("Ben's Bites")) return 'bensbites';
      if (source && source.includes("Rundown")) return 'rundown';
      if (source && (source.includes("Reddit") || source.startsWith('r/'))) return 'reddit';
      if (source && source.includes("Hacker")) return 'hackernews';
      return 'reddit';
    }
    
    function getSourceLabel(source) {
      if (!source) return 'Unknown';
      if (source.includes("Ben's Bites")) return "Ben's Bites";
      if (source.includes("Rundown")) return "The Rundown AI";
      if (source.startsWith('r/')) return source;
      if (source.includes("Hacker")) return "Hacker News";
      return source;
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    
    function updateStats(articles) {
      try {
        if (!articles || !Array.isArray(articles)) return;
        
        const total = articles.length;
        const saved = savedArticles.length;
        const sources = [...new Set(articles.map(a => a.source))].length;
        
// Count articles from the last 24 hours
      const now = new Date();
      const dayAgo = new Date(now.getTime() - 24*60*60*1000);
      const todayCount = articles.filter(a => {
        if (!a || !a.published_at) return false;
        return new Date(a.published_at) >= dayAgo;
      }).length;
        
        const totalEl = document.getElementById('totalArticles');
        const savedEl = document.getElementById('savedArticles');
        const sourcesEl = document.getElementById('totalSources');
        const todayEl = document.getElementById('todayArticles');
        
        if (totalEl) totalEl.textContent = total;
        if (savedEl) savedEl.textContent = saved;
        if (sourcesEl) sourcesEl.textContent = sources;
        if (todayEl) todayEl.textContent = todayCount;
      } catch (e) {
        console.error('Error updating stats:', e);
      }
    }
    
function renderArticles(articles) {
  const container = document.getElementById('articlesContainer');
  
  if (!articles || articles.length === 0) {
    container.innerHTML = '<div class="loading">No articles found</div>';
    document.getElementById('pagination')?.remove();
    return;
  }
  
  const totalPages = Math.ceil(articles.length / ARTICLES_PER_PAGE);
  if (currentPage > totalPages) currentPage = 1;
  
  const startIdx = (currentPage - 1) * ARTICLES_PER_PAGE;
  const pageArticles = articles.slice(startIdx, startIdx + ARTICLES_PER_PAGE);
  
  container.innerHTML = pageArticles.map(article => {
    if (!article || !article.id) return '';
    const isSaved = savedArticles.includes(article.id);
    const categories = classifyArticle(article);
    
    const categoryLabels = categories.map(cat => TOPIC_CATEGORIES[cat].label);
    const tagHtml = categoryLabels.length ? `<div class="article-tags">${categoryLabels.map(cat => `<span class="article-tag">${cat}</span>`).join('')}</div>` : '';
    
    // Format date and time
    const dateObj = article.published_at ? new Date(article.published_at) : null;
    const dateStr = dateObj ? dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const timeStr = dateObj ? dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
    
    return `
<div class="article">
                          ${article.image_url ? `<img src="${article.image_url}" class="article-image" loading="lazy" alt="Article Image">` : ''}
                          <div class="article-header">
          <span class="source-badge ${getSourceClass(article.source)}">${getSourceLabel(article.source)}</span>
          <span class="article-date">${dateStr} at ${timeStr}</span>
        </div>
        <div class="article-content">
          <h3><a href="${article.url || '#'}" target="_blank">${article.title || article.web_title || ''}</a></h3>
          ${tagHtml}
          <button class="expand-btn" id="btn-${article.id}" onclick="toggleExpand('${article.id}')">Read more</button>
          <div class="full-content" id="content-${article.id}">

          </div>
        </div>
        <div class="article-footer">
          <button class="save-icon ${isSaved ? 'saved' : ''}" id="save-${article.id}" onclick="toggleSave('${article.id}')">★</button>
        </div>
      </div>
    `;
  }).join('');

  // Create pagination
  let paginationHTML = '<div class="pagination">';
  if (currentPage > 1) {
    paginationHTML += `<button class="page-btn" data-page="${currentPage - 1}">Previous</button>`;
  }
  for (let i = 1; i <= totalPages; i++) {
    paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
  }
  if (currentPage < totalPages) {
    paginationHTML += `<button class="page-btn" data-page="${currentPage + 1}">Next</button>`;
  }
  paginationHTML += `<span class="page-info">Page ${currentPage} of ${totalPages}</span>`;
  paginationHTML += '</div>';

  // Remove existing pagination if exists
  const existingPagination = document.getElementById('pagination');
  if (existingPagination) existingPagination.remove();

  // Append new pagination
  const paginationDiv = document.createElement('div');
  paginationDiv.id = 'pagination';
  paginationDiv.innerHTML = paginationHTML;
  container.appendChild(paginationDiv);

  // Add event listeners for pagination buttons
  document.querySelectorAll('#pagination .page-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = parseInt(btn.dataset.page);
      if (page) {
        currentPage = page;
        window.scrollTo(0, 0);
        filterArticles(); // Re-render with new page
      }
    });
  });
}
    
function toggleExpand(id) {
  const btn = document.getElementById('btn-' + id);
  const content = document.getElementById('content-' + id);
  const expanded = btn.dataset.expanded === 'true';
  
  if (expanded) {
    content.style.display = 'none';
    btn.textContent = 'Read more';
    btn.dataset.expanded = 'false';
  } else {
    // Check if summary is already fetched for this article
    if (content.innerHTML.trim() === '') {
      content.innerHTML = '<div class="loading">Summarizing...</div>';
      fetchArticleSummary(id).then(summary => {
        content.innerHTML = summary;
      }).catch(error => {
        content.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
      });
    }
    content.style.display = 'block';
    btn.textContent = 'Show less';
    btn.dataset.expanded = 'true';
  }
}
    
    async function fetchArticleSummary(articleId) {
  const article = allArticles.find(a => a.id === articleId);
  if (!article) return 'Article not found';
  
  const prompt = `Summarize this article in 2-3 sentences: Title: ${article.title}`;
  
  const messages = [
    { role: 'system', content: 'You are an AI assistant that summarizes news articles. Provide a concise 2-3 sentence summary of the given article title.' },
    { role: 'user', content: prompt }
  ];
  
  const response = await callAIAPI(messages);
  return response;
}

function filterArticles() {
      try {
        if (!allArticles || !Array.isArray(allArticles)) {
          console.log('No articles loaded yet');
          return;
        }
        
        let filtered = allArticles;
        
// Optionally filter by category – keep all articles (including those with image_url) for now
      // filtered = filtered.filter(a => {
      //   const categories = classifyArticle(a);
      //   console.log('Article:', a.title?.substring(0, 30), '-> categories:', categories);
      //   return categories.length > 0;
      // });
        
        if (currentFilter === 'saved') {
          filtered = filtered.filter(a => savedArticles.includes(a.id));
        } else if (currentFilter !== 'all') {
          filtered = filtered.filter(a => a.source && a.source.includes(currentFilter));
        }
        
        if (currentTag) {
          filtered = filtered.filter(a => {
            const categories = classifyArticle(a);
            return categories.includes(currentTag);
          });
        }
        
        renderArticles(filtered);
      } catch (e) {
        console.error('Error in filterArticles:', e);
      }
    }
    
    function filterByTopic(topic) {
      if (topic === 'all') {
        currentTag = null;
      } else {
        currentTag = currentTag === topic ? null : topic;
      }
      
      document.querySelectorAll('.topic-btn').forEach(btn => {
        if (btn.dataset.topic === 'all') {
          btn.classList.toggle('active', currentTag === null);
        } else {
          btn.classList.toggle('active', btn.dataset.topic === currentTag);
        }
      });
      
      filterArticles();
    }
    
    function setFilter(filter) {
      document.querySelector('.filter-btn.active').classList.remove('active');
      document.querySelector('[data-filter="' + filter + '"]').classList.add('active');
      currentFilter = filter;
      filterArticles();
    }
    
    function toggleSave(articleId) {
      if (savedArticles.includes(articleId)) {
        savedArticles = savedArticles.filter(id => id !== articleId);
      } else {
        savedArticles.push(articleId);
      }
      localStorage.setItem('savedArticles', JSON.stringify(savedArticles));
      updateStats(allArticles);
      filterArticles();
    }
    
    // Configuration - uses env.js injected by Vercel build, or falls back to defaults
    const CONFIG = {
      supabase: {
        url: window.ENV?.SUPABASE_URL || 'SUPABASE_URL_PLACEHOLDER',
        key: window.ENV?.SUPABASE_ANON_KEY || 'SUPABASE_KEY_PLACEHOLDER'
      },
      ai: {
        provider: 'groq',
        apiKey: window.ENV?.GROQ_API_KEY || 'GROQ_KEY_PLACEHOLDER',
        model: 'llama-3.3-70b-versatile'
      }
    };
    
    async function loadArticles() {
      try {
        let articles = [];
        
        const headers = {
          'apikey': CONFIG.supabase.key,
          'Authorization': `Bearer ${CONFIG.supabase.key}`,
          'Content-Type': 'application/json',
          'Prefer': 'count=exact'
        };
        
        const response = await fetch(`${CONFIG.supabase.url}/rest/v1/articles?select=*&order=published_at.desc&limit=1000`, { 
          headers,
          mode: 'cors'
        });
        
        if (!response.ok) {
          const errorText = await response.text();
          let msg = `Supabase error (${response.status})`;
          if (errorText.includes('relation') && errorText.includes('does not exist')) {
            msg = 'Table "articles" does not exist. Create it in Supabase SQL Editor.';
          } else if (response.status === 404) {
            msg = 'Invalid Supabase URL or table not found';
          } else if (response.status === 401 || response.status === 403) {
            msg = 'Invalid Supabase key';
          }
          throw new Error(msg);
        }
        
        const supabaseData = await response.json();
        
        if (!Array.isArray(supabaseData)) {
          throw new Error('Invalid response from Supabase - table may not exist');
        }
        
        articles = supabaseData.map(a => ({
          id: a.id,
          title: a.title,
          subtitle: a.subtitle || '',
          url: a.url,
          source: a.source,
          published_at: a.published_at,
          saved: a.saved || false,
          tags: typeof a.tags === 'string' ? JSON.parse(a.tags) : (a.tags || []),
          reading_time: a.reading_time || '',
          score: a.score || 0,
          comments: a.comments || 0
        }));
        
        document.querySelector('.sync').textContent = articles.length + ' articles';
        
        allArticles = articles;
        updateStats(allArticles);
        filterArticles();
      } catch (e) {
        document.getElementById('articlesContainer').innerHTML = 
          '<div class="loading">Error loading articles: ' + e.message + '</div>';
      }
    }
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const activeBtn = document.querySelector('.filter-btn.active');
        if (activeBtn) activeBtn.classList.remove('active');
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        filterArticles();
      });
    });
    
    // Initialize topic buttons
    const topicAllBtn = document.querySelector('.topic-btn[data-topic="all"]');
    if (topicAllBtn) topicAllBtn.classList.add('active');
    
    async function callAIAPI(messages) {
      if (!CONFIG.ai.apiKey) {
        return null;
      }
      
      const provider = CONFIG.ai.provider;
      const model = CONFIG.ai.model;
      let url, headers, body;
      
      try {
        if (provider === 'openai') {
          url = 'https://api.openai.com/v1/chat/completions';
          headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CONFIG.ai.apiKey}`
          };
          body = {
            model: model || 'gpt-4o',
            messages: messages,
            max_tokens: 1000
          };
        } else if (provider === 'anthropic') {
          url = 'https://api.anthropic.com/v1/messages';
          headers = {
            'Content-Type': 'application/json',
            'x-api-key': CONFIG.ai.apiKey,
            'anthropic-version': '2023-06-01'
          };
          body = {
            model: model || 'claude-3-5-sonnet-20241022',
            messages: messages.filter(m => m.role !== 'system'),
            max_tokens: 1000
          };
        } else if (provider === 'google') {
          url = `https://generativelanguage.googleapis.com/v1beta/models/${model || 'gemini-1.5-flash'}:generateContent?key=${CONFIG.ai.apiKey}`;
          headers = { 'Content-Type': 'application/json' };
          body = {
            contents: messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })),
            generationConfig: { maxOutputTokens: 1000 }
          };
        } else if (provider === 'groq') {
          url = 'https://api.groq.com/openai/v1/chat/completions';
          headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CONFIG.ai.apiKey}`
          };
          body = {
            model: model || 'llama-3.1-70b-versatile',
            messages: messages,
            max_tokens: 1000
          };
        } else if (provider === 'openrouter') {
          url = 'https://openrouter.ai/api/v1/chat/completions';
          headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CONFIG.ai.apiKey}`,
            'HTTP-Referer': window.location.href,
            'X-Title': 'AI News Dashboard'
          };
          body = {
            model: model || 'openai/gpt-4o',
            messages: messages,
            max_tokens: 1000
          };
        } else if (provider === 'nvidia') {
          url = 'https://integrate.api.nvidia.com/v1/chat/completions';
          headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CONFIG.ai.apiKey}`
          };
          body = {
            model: model || 'nvidia/llama-3.1-nemotron-70b-instruct',
            messages: messages,
            max_tokens: 1000
          };
        }
        
        const response = await fetch(url, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(body)
        });
        
        if (!response.ok) {
          const error = await response.text();
          throw new Error(error);
        }
        
        const data = await response.json();
        
        if (provider === 'anthropic') {
          return data.content[0].text;
        } else if (provider === 'google') {
          return data.candidates[0].content.parts[0].text;
        } else {
          return data.choices[0].message.content;
        }
      } catch (e) {
        console.error('API Error:', e);
        return 'Error: ' + e.message;
      }
    }
    
    function addBotMessage(text) {
      const messagesDiv = document.getElementById('chatMessages');
      messagesDiv.innerHTML += `<div class="chat-message bot">${text}</div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function makeLinksClickable(text) {
      const urlRegex = /(https?:\/\/[^\s<>\)]+)/g;
      return text.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
    }
    
    // Chatbot functions
    let chatInitialized = false;
    
    function toggleChat() {
      document.getElementById('chatContainer').classList.toggle('open');
      
      if (!chatInitialized) {
        chatInitialized = true;
        // Clear any default messages
        document.getElementById('chatMessages').innerHTML = '';
        document.getElementById('chatMessages').innerHTML = `<div class="chat-message bot">Hello! I'm ready to help you discuss the AI news. Ask me anything about the articles!</div>`;
      }
    }
    
    // Chatbot with context window
    let chatHistory = [];
    const MAX_CONTEXT = 10;
    
    function handleChatKey(e) {
      if (e.key === 'Enter') sendMessage();
    }
    
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;
      
      const messagesDiv = document.getElementById('chatMessages');
      
      messagesDiv.innerHTML += `<div class="chat-message user">${message}</div>`;
      input.value = '';
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      chatHistory.push({ role: 'user', content: message });
      if (chatHistory.length > MAX_CONTEXT) chatHistory.shift();
      
      // Show typing indicator
      messagesDiv.innerHTML += `<div class="chat-message bot" id="typingMsg">🤔 Thinking...</div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      setTimeout(async () => {
        let response;
        
        // Check if API is configured
        if (CONFIG.ai.apiKey) {
          const systemPrompt = `You are a helpful AI assistant for an AI news dashboard. You have access to ${allArticles.length} articles. 
          
Here are the articles with their URLs:
${allArticles.slice(0, 15).map((a, i) => `${i+1}. ${a.title}
   Source: ${a.source}
   URL: ${a.url || 'N/A'}
   Summary: ${a.subtitle?.substring(0, 150) || 'No description'}`).join('\n\n')}

When discussing articles, ALWAYS include the article URL in your response so users can click to read the full article. Be helpful, concise, and friendly.`;
          
          const apiMessages = [
            { role: 'system', content: systemPrompt },
            ...chatHistory.slice(-6).map(h => ({ role: h.role, content: h.content }))
          ];
          
          response = await callAIAPI(apiMessages);
          
          if (!response) {
            response = 'Sorry, I encountered an error. Please try again.';
          }
        } else {
          response = 'Sorry, I encountered an error. Please try again.';
        }
        
        // Remove typing indicator and add response
        const typingMsg = document.getElementById('typingMsg');
        if (typingMsg) typingMsg.remove();
        
        const clickableResponse = makeLinksClickable(response);
        messagesDiv.innerHTML += `<div class="chat-message bot">${clickableResponse}</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        chatHistory.push({ role: 'assistant', content: response });
        if (chatHistory.length > MAX_CONTEXT) chatHistory.shift();
      }, 800);
    }
    
    loadArticles();
  </script>
</head>
<body>
    <div class="header">
      <h1>The Neural Feed</h1>
      <div class="header-right">
        <div class="sync">Loading...</div>
      </div>
    </div>
  
  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <h3>Articles</h3>
        <div class="value" id="totalArticles">-</div>
      </div>
      <div class="stat-card">
        <h3>Saved</h3>
        <div class="value" id="savedArticles">-</div>
      </div>
      <div class="stat-card">
        <h3>Sources</h3>
        <div class="value" id="totalSources">-</div>
      </div>
      <div class="stat-card">
        <h3>Today</h3>
        <div class="value" id="todayArticles">-</div>
      </div>
    </div>
    
    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="Ben's Bites" onclick="setFilter('Ben\'s Bites')">Ben's Bites</button>
      <button class="filter-btn" data-filter="The Rundown AI" onclick="setFilter('The Rundown AI')">The Rundown AI</button>
      <button class="filter-btn" data-filter="r/artificial" onclick="setFilter('r/artificial')">Reddit</button>
      <button class="filter-btn" data-filter="Hacker News" onclick="setFilter('Hacker News')">Hacker News</button>
      <button class="filter-btn" data-filter="saved" onclick="setFilter('saved')">Saved</button>
    </div>
    
    <div class="topic-filters">
      <span class="topic-filter-label">Topics:</span>
      <button class="topic-btn active" data-topic="all" onclick="filterByTopic('all')">All</button>
      <button class="topic-btn" data-topic="agentic-ai" onclick="filterByTopic('agentic-ai')">Agentic AI</button>
      <button class="topic-btn" data-topic="market-updates" onclick="filterByTopic('market-updates')">Market updates</button>
      <button class="topic-btn" data-topic="demanded-skills" onclick="filterByTopic('demanded-skills')">Demanded AI skills</button>
      <button class="topic-btn" data-topic="new-model-releases" onclick="filterByTopic('new-model-releases')">New model releases</button>
    </div>
    
    <div class="articles" id="articlesContainer">
      <div class="loading">Loading articles...</div>
    </div>
    </div>
    
    <!-- AI Chatbot -->
    <button class="chat-toggle" onclick="toggleChat()">💬 AI Assistant</button>
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <span>AI Assistant</span>
        <button class="chat-close" onclick="toggleChat()">×</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-message bot">Hello! I'm your AI assistant. Ask me about any articles or topics you see here, and I can help summarize or discuss them with you.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask about articles..." onkeypress="handleChatKey(event)">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </body>
</html>
